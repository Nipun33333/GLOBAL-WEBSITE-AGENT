name: Agent runtime
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      scheduled:
        default: false
        type: boolean
      production:
        default: false
        type: boolean
      country:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: agent-runtime
    concurrency:
      group: global-website-agent-runtime
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GEMINI_ADVANCED_MODEL: ${{ vars.GEMINI_ADVANCED_MODEL || 'gemini-4-argon' }}
      GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
      DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      ENABLE_SENDING: ${{ vars.ENABLE_SENDING || 'false' }}
      ENABLE_ROUTINE_REPLIES: ${{ vars.ENABLE_ROUTINE_REPLIES || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Apply database migrations
        run: uv run website-agent migrate
      - name: Execute authorized command
        env:
          AGENT_COMMAND: ${{ inputs.command }}
          AGENT_COUNTRY: ${{ inputs.country }}
          AGENT_SCHEDULED: ${{ inputs.scheduled }}
          AGENT_PRODUCTION: ${{ inputs.production }}
        run: uv run python scripts/action_entry.py
      - name: Retain sanitized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/report.md
          retention-days: 14
          if-no-files-found: ignore
