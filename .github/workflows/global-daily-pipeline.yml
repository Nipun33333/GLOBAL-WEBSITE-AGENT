name: Global daily pipeline
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    if: vars.AUTOMATION_ENABLED == 'true'
    uses: ./.github/workflows/_agent-runtime.yml
    with:
      command: daily
      scheduled: true
      production: true
    secrets: inherit
