name: UK Website Agent
on:
  workflow_dispatch:  # One-click owner dispatch; no form inputs.
  schedule:
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
permissions:
  contents: read
jobs:
  agent:
    if: >-
      github.repository == 'Nipun33333/GLOBAL-WEBSITE-AGENT' && github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'schedule' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: agent-runtime
    concurrency:
      group: global-website-agent-runtime
      cancel-in-progress: false
    env:
      ONE_CLICK_MODE: 'true'
      AGENT_MODE: 'daily'
      AGENT_COUNTRY: 'GB'  # ISO code for the entire United Kingdom
      AGENT_CRON: ${{ github.event.schedule }}
      REVIEWED_COMMIT: ''
      WRITE_APPROVAL: ''
      FREE_LIMITS_REVIEWED: ${{ vars.FREE_LIMITS_REVIEWED || 'false' }}
      DATABASE_REVIEWED: ${{ vars.DATABASE_REVIEWED || 'false' }}
      AUTOMATION_ENABLED: 'true'  # Owner authorized twice-daily scheduling.
      UNIFIED_WORKFLOW_ENABLED: 'true'
      SCHEDULED_MODES: 'daily'  # Keep replies and followups manual/disabled.
      ALLOW_GENERATION: 'true'
      ALLOW_DEPLOYMENT: 'true'
      ALLOW_DRAFTS: 'true'
      ALLOW_SENDING: 'true'
      OUTREACH_POLICY_MODE: 'operator_managed'  # Owner manages outreach obligations; no fabricated review records.
      ENABLE_SENDING: 'true'  # Sends only after verified site + country and Gmail deduplication checks.
      ENABLE_ROUTINE_REPLIES: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Verify immutable dispatch revision before executing repository code
        run: |
          python - <<'PY'
          import os, re, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          event_sha = os.environ['GITHUB_SHA']
          reviewed = os.environ.get('REVIEWED_COMMIT', '')
          if not re.fullmatch(r'[0-9a-f]{40}', event_sha) or actual != event_sha:
              raise SystemExit('Branch changed after dispatch; credentials remain unloaded.')
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and reviewed and reviewed != actual:
              raise SystemExit('Reviewed SHA mismatch; credentials remain unloaded.')
          PY
      - name: Validate dispatch and reviewed revision before loading credentials
        id: preflight
        run: python scripts/master_entry.py --preflight
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --no-dev
      - if: steps.preflight.outputs.browser == 'true'
        run: uv run playwright install --with-deps chromium
      - name: Execute approved operation
        env:
          LIVE_ACCOUNT_DIAGNOSTICS: 'true'  # Owner-run metadata/identity only, no side effects.
          SUPABASE_CA_CERT_PEM: ${{ secrets.SUPABASE_CA_CERT_PEM }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_ADVANCED_MODEL: ${{ vars.GEMINI_ADVANCED_MODEL || 'gemini-4-argon' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OUTREACH_AUTHORIZATION_JSON: ${{ secrets.OUTREACH_AUTHORIZATION_JSON }}
          DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
        run: |
          # Optional project CA certificate, loaded from a one-time GitHub Secret.
          # No certificate bytes are logged or stored in workflow artifacts.
          umask 077
          if [ -n "$SUPABASE_CA_CERT_PEM" ]; then
            export SUPABASE_CA_CERT_PATH="$RUNNER_TEMP/supabase-ca.pem"
            printf '%s\n' "$SUPABASE_CA_CERT_PEM" > "$SUPABASE_CA_CERT_PATH"
            unset SUPABASE_CA_CERT_PEM
            trap 'rm -f "$SUPABASE_CA_CERT_PATH"' EXIT
          fi
          uv run python scripts/master_entry.py
      - name: Retain only sanitized aggregate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/live-verification.json
            artifacts/live-verification.md
          retention-days: 1
          if-no-files-found: ignore
