name: Global Website Agent
on:
  workflow_dispatch:  # One-click owner dispatch; no form inputs.
  schedule:
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
permissions:
  contents: read
jobs:
  agent:
    if: >-
      github.repository == 'Nipun33333/GLOBAL-WEBSITE-AGENT' && github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
        vars.AUTOMATION_ENABLED == 'true' && vars.UNIFIED_WORKFLOW_ENABLED == 'true' &&
        vars.FREE_LIMITS_REVIEWED == 'true' && vars.DATABASE_REVIEWED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: agent-runtime
    concurrency:
      group: global-website-agent-runtime
      cancel-in-progress: false
    env:
      ONE_CLICK_MODE: 'true'
      AGENT_MODE: ${{ inputs.mode }}
      AGENT_COUNTRY: ${{ inputs.country }}
      AGENT_CRON: ${{ github.event.schedule }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      WRITE_APPROVAL: ${{ inputs.write_approval }}
      FREE_LIMITS_REVIEWED: ${{ vars.FREE_LIMITS_REVIEWED || 'false' }}
      DATABASE_REVIEWED: ${{ vars.DATABASE_REVIEWED || 'false' }}
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
      UNIFIED_WORKFLOW_ENABLED: ${{ vars.UNIFIED_WORKFLOW_ENABLED || 'false' }}
      SCHEDULED_MODES: ${{ vars.SCHEDULED_MODES }}
      ALLOW_GENERATION: ${{ vars.ALLOW_GENERATION || 'false' }}
      ALLOW_DEPLOYMENT: ${{ vars.ALLOW_DEPLOYMENT || 'false' }}
      ALLOW_DRAFTS: ${{ vars.ALLOW_DRAFTS || 'false' }}
      ALLOW_SENDING: ${{ vars.ALLOW_SENDING || 'false' }}
      ENABLE_SENDING: ${{ vars.ENABLE_SENDING || 'false' }}
      ENABLE_ROUTINE_REPLIES: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Verify immutable dispatch revision before executing repository code
        run: |
          python - <<'PY'
          import os, re, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          event_sha = os.environ['GITHUB_SHA']
          reviewed = os.environ.get('REVIEWED_COMMIT', '')
          if not re.fullmatch(r'[0-9a-f]{40}', event_sha) or actual != event_sha:
              raise SystemExit('Branch changed after dispatch; credentials remain unloaded.')
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and reviewed and reviewed != actual:
              raise SystemExit('Reviewed SHA mismatch; credentials remain unloaded.')
          PY
      - name: Validate dispatch and reviewed revision before loading credentials
        id: preflight
        run: python scripts/master_entry.py --preflight
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --no-dev
      - if: steps.preflight.outputs.browser == 'true'
        run: uv run playwright install --with-deps chromium
      - name: Execute approved operation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_ADVANCED_MODEL: ${{ vars.GEMINI_ADVANCED_MODEL || 'gemini-4-argon' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          DISCOVERY_API_KEY: ${{ secrets.DISCOVERY_API_KEY }}
        run: uv run python scripts/master_entry.py
      - name: Retain only sanitized aggregate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/live-verification.json
            artifacts/live-verification.md
          retention-days: 1
          if-no-files-found: ignore
