name: Gmail reply checker
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    if: vars.AUTOMATION_ENABLED == 'true'
    uses: ./.github/workflows/_agent-runtime.yml
    with:
      command: replies
      scheduled: false
      production: true
    secrets: inherit
