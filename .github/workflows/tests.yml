name: Tests and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: agent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agent_test:test_only_password@localhost:5432/agent_test
      ENABLE_SENDING: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run pytest --cov=website_agent --cov-report=term-missing --junitxml=artifacts/tests.xml
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --no-dev --format requirements-txt --output-file artifacts/requirements.txt
          uv run pip-audit -r artifacts/requirements.txt --disable-pip --no-deps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-results
          path: artifacts/
          retention-days: 14
