# All limits are GLOBAL. Edit configuration, not Python, to change coverage.
limits:
  discovered: 30
  inspected: 10
  qualified: 5
  previews_daily: 2
  outreach_daily: 2
  followups_daily: 2
  max_followups: 2
  threshold: 55
  ai_requests_daily: 30
  ai_budget_usd: 1.0
  database_max_mb: 400
schedule_timezone: UTC
schedule_hour: 3
research_hours: [8, 20]
discovery_provider: brave
# Must reference a reviewed agreement permitting storage AND this marketing use.
# Standard search availability does not grant these rights.
provider_agreement_reference: ''
storage_and_outreach_use_authorized: false
discovery_endpoint: ''
search_template: '{niche} {city} {country} official website'
# Add verified current pricing per million tokens for each enabled model.
# Example shape only: {gemini-model: {input_per_million: 0.0, output_per_million: 0.0}}
model_prices: {}
niches:
  - salons
  - spas
  - gyms
  - fitness studios
  - dentists
  - restaurants
  - cafes
  - retail stores
  - barbershops
  - clinics
  - repair shops
  - small professional services
