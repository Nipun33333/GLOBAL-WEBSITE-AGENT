# All limits are GLOBAL. Edit configuration, not Python, to change coverage.
limits:
  discovered: 1
  inspected: 1
  qualified: 1
  previews_daily: 2
  outreach_daily: 2
  followups_daily: 0
  max_followups: 0
  threshold: 55
  ai_requests_daily: 30
  ai_budget_usd: 1.0
  database_max_mb: 400
schedule_timezone: Asia/Kolkata
schedule_hour: 15
schedule_hours: [15, 21]  # India: 3 PM and 9 PM, separate durable slots
research_hours: [8, 20]
discovery_provider: open_data
# Must reference a reviewed agreement permitting storage AND this marketing use.
# Standard search availability does not grant these rights.
# The following legacy paid-search settings are unused in open_data mode.
provider_agreement_reference: ''
storage_and_outreach_use_authorized: false
discovery_endpoint: ''
search_template: '{niche} {city} {country} official website'
# Public Gemini API STANDARD FREE-TIER text-token pricing reviewed 2026-10-21.
# These are reference prices ONLY. They do NOT authorize an account to use a model.
# Actual zero-cost generation still requires a current per-model authorization in
# gemini.usage_authorizations, successful account metadata, and remaining free quota.
# Paid-tier prices are not mapped; unknown/paid capacity MUST defer safely.
# Source: https://ai.google.dev/gemini-api/docs/pricing
model_prices:
  gemini-3.8-flash: {input_per_million: 0.0, output_per_million: 0.0}
  gemini-3.6-flash: {input_per_million: 0.0, output_per_million: 0.0}
  gemini-3.5-flash-lite: {input_per_million: 0.0, output_per_million: 0.0}
  gemini-3.1-flash-lite: {input_per_million: 0.0, output_per_million: 0.0}
# Official capability catalog is bounded and expires; account eligibility is separate.
gemini:
  automatic_fallback: true
  prefer_free_tier: true
  allow_paid_fallback: false
  max_model_attempts: 3
  retries_per_model: 2
  cooldown_seconds: 900
  max_output_tokens: 8192
  fallback_models: [gemini-3.6-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-2.5-flash, gemini-2.5-flash-lite]
  usage_authorizations: {}  # Owner-reviewed tier, reference and expiry for each exact model.

