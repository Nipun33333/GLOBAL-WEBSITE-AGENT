# Zero-key discovery. These are search envelopes, not legal/administrative boundaries.
# Address city/country must independently match; unknown geography is rejected.
discovery:
  source_priority: [overture, osm_extract]
  release: '2026-09-23.1'
  release_reference: 'https://docs.overturemaps.org/getting-data/'
  overture_enabled: true
  radius_steps_km: [3, 8, 15]
  max_radius_km: 25
  max_cities: 2
  max_queries: 8
  max_candidates: 120
  max_files_per_query: 8
  max_requests: 160
  max_download_bytes: 64000000
  max_disk_bytes: 128000000
  max_memory_mb: 512
  max_seconds: 300
  max_attempts: 3
  retry_base_seconds: 1
  cooldown_seconds: 3600
  empty_retry_hours: 24
  max_retry_cycles: 7
  cache_hours: 168
  taxonomy_path: config/discovery-taxonomy.yml
  osm_extracts: []
  osm_license_review_reference: ''
  osm_database_obligations_accepted: false
  overpass_endpoint: ''
  overpass_private_or_contracted: false
  overpass_commercial_use_authorized: false
  overpass_agreement_reference: ''
